<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DP Toolkit Update</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1b1e29; color: #e3e6ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #card {
      width: 440px; background: #262a38; border: 1px solid #353b4d;
      border-radius: 12px; padding: 24px; text-align: center;
    }
    #card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    #card p { font-size: 0.85rem; color: #9aa0ad; line-height: 1.5; margin-bottom: 18px; }
    #card .version { font-family: monospace; color: #00d1b2; }
    .btn-row { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .btn-yes { background: #00d1b2; color: #111; }
    .btn-yes:hover { background: #00b89c; }
    .btn-no { background: transparent; color: #9aa0ad; border: 1px solid #353b4d; }
    .btn-no:hover { border-color: #6b7280; color: #e3e6ee; }
    .countdown { font-size: 2rem; font-weight: 700; color: #00d1b2; margin-bottom: 10px; }
    .reminder { color: #fbbf24; }
    .done { color: #5eead4; }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="reload.js"></script>
</body>
</html>
