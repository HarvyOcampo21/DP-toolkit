<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DP Toolkit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1b1e29; color: #e3e6ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    height: 100%;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden; /* only #listContainer scrolls internally */
  }

  .content {
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
    padding: 16px 16px 14px; max-width: 640px;
  }

  /* ── Shared identity picker ── */
  #setup label { display: block; color: #9aa0ad; font-size: 0.82rem; margin-bottom: 6px; }
  #setup select {
    width: 100%; background: #262a38; border: 1px solid #353b4d;
    color: #e3e6ee; border-radius: 8px; padding: 7px 10px;
    font-size: 0.88rem; margin-bottom: 10px;
  }
  #setup button.save {
    width: 100%; background: #00d1b2; border: none; color: #111;
    font-weight: 700; border-radius: 8px; padding: 8px;
    font-size: 0.9rem; cursor: pointer;
  }
  #setup button.save:hover { background: #00b89c; }

  #identityBar {
    display: none; align-items: center; justify-content: space-between;
    background: #262a38; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px;
  }
  #identityBar .who-wrap { display: flex; align-items: center; }
  #identityBar .who { font-size: 0.85rem; font-weight: 600; color: #c7cbd8; }
  #identityBar button {
    background: none; border: none; color: #6b7280;
    font-size: 0.76rem; text-decoration: underline; cursor: pointer;
  }

  #assignSection { display: none; flex-direction: column; flex: 1; min-height: 0; }

  /* ── Assignment cards ── */
  .section-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: #6b7280; margin-bottom: 7px;
  }
  .section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

  /* ── Category filter tabs — a Chrome-pinned-tabs-style icon strip.
     Icon-only tabs sitting directly on the page (no enclosing well),
     thin dividers between neighbors, active tab lit with a teal icon
     + count badge. ── */
  .dp-tabs {
    display: flex; align-items: center; gap: 2px;
    width: fit-content; max-width: 100%; overflow-x: auto;
    /* overflow-x: auto forces overflow-y to auto too, which was clipping
       the count badges poking above/right of each icon — the padding
       gives them room, the matching negative margin cancels it back out
       so the row's own position doesn't shift. */
    padding: 6px 6px 2px 2px;
    margin: -6px -6px 8px -2px;
  }
  .dp-tabs::-webkit-scrollbar { display: none; }
  .dp-tab {
    position: relative; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 30px; border-radius: 7px;
    cursor: pointer;
  }
  .dp-tab:not(:last-child)::after {
    content: ""; position: absolute; right: -1px; top: 22%; bottom: 22%; width: 1px;
    background: #2f3444;
  }
  .dp-tab.is-active::after, .dp-tab.is-active + .dp-tab::after { background: transparent; }
  .dp-tab:hover { background: #20232f; }
  .dp-tab.is-active { background: #2b2f3d; }
  .dp-tab-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    background-color: #767c8c;
    -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
    mask-size: contain; mask-repeat: no-repeat; mask-position: center;
  }
  .dp-tab:hover .dp-tab-icon { background-color: #9aa0ad; }
  .dp-tab.is-active .dp-tab-icon { background-color: #00d1b2; }
  .dp-tab-count {
    position: absolute; top: -4px; right: -4px; min-width: 14px; height: 14px;
    padding: 0 3px; border-radius: 7px; background: #353b4d; color: #c7cbd8;
    font-size: 9px; font-weight: 800; line-height: 14px; text-align: center;
  }
  .dp-tab.is-active .dp-tab-count { background: #00d1b2; color: #0d1017; }

  #listContainer {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    flex: 1; min-height: 0; overflow-y: auto; align-content: start;
  }
  /* Everything else in #assignSection (title, tabs, divider, stats, quick
     links) keeps its natural size — only the card list itself scrolls,
     which is what keeps Quick Links + the footer pinned to the bottom of
     the panel regardless of how many/few cards are showing. */
  #assignSection > *:not(#listContainer) { flex-shrink: 0; }
  .assign-card {
    background: #262a38; border: 1px solid #353b4d; border-radius: 9px; padding: 12px 14px;
  }
  .ac-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .ac-listing-ref { font-size: 14px; font-weight: 700; color: #e3e6ee; overflow-wrap: anywhere; }
  .ac-top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ac-type-tag {
    flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 10px; letter-spacing: 0.02em;
  }
  .ac-type-rental { background: rgba(59,130,246,0.18); color: #7cb0f5; }
  .ac-type-sales  { background: rgba(34,197,94,0.18);  color: #4ade80; }
  .ac-req-ref { font-size: 11px; color: #6b7280; margin-bottom: 10px; font-family: monospace; }
  .ac-ref-clickable { cursor: pointer; text-decoration-line: underline; text-decoration-style: dotted; text-decoration-color: transparent; transition: color 0.15s ease, text-decoration-color 0.15s ease; }
  .ac-ref-clickable:hover { color: #00d1b2; text-decoration-color: #00d1b2; }
  .ac-bottom-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .ac-category {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
  }
  .ac-status {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  }
  .cat-photos-qc       { background: rgba(0,209,178,0.18);   color: #00d1b2; }
  .cat-stock-photos-qc { background: rgba(168,85,247,0.18);  color: #c9a4fa; }
  .cat-offplan-pending { background: rgba(230,148,26,0.18);  color: #f0b24a; }
  .cat-upload-pending  { background: rgba(154,160,173,0.18); color: #c7cbd8; }

  /* ── Card actions: Start/Hold/Restart/View Reason — sit inline beside
     the category pill in .ac-bottom-row ── */
  .ac-actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ac-btn {
    border: 1px solid; border-radius: 6px; background: transparent;
    padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .ac-start-btn  { color: #00d1b2; border-color: #00d1b2; }
  .ac-start-btn:hover  { background: rgba(0,209,178,0.14); }
  .ac-hold-btn   { color: #c9a4fa; border-color: #b39ddb; }
  .ac-hold-btn:hover   { background: rgba(179,157,219,0.14); }
  .ac-reason-btn { color: #9aa0ad; border-color: #353b4d; }
  .ac-reason-btn:hover { background: #2b2f3d; }

  /* ── Card icon row: Drive / History / Copy-ref ── */
  .ac-icon-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .ac-icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    background: #1f222e; border: 1px solid #353b4d; color: #9aa0ad; cursor: pointer;
  }
  .ac-icon-btn:hover { border-color: #00d1b2; color: #00d1b2; }
  .ac-icon-btn.is-active { border-color: #00d1b2; color: #00d1b2; background: rgba(0,209,178,0.10); }
  .ac-icon-btn.is-copied { border-color: #00d1b2; color: #00d1b2; }

  /* ── Sliding history panel — animates max-height, pushing later cards
     down as it opens instead of overlaying them ── */
  .ac-history-panel {
    max-height: 0; overflow: hidden;
    transition: max-height 0.28s ease;
  }
  .ac-timeline { padding-top: 10px; }
  .ac-timeline-empty { color: #6b7280; font-size: 11px; padding: 6px 0; }
  .ac-timeline-row { display: flex; gap: 8px; }
  .ac-timeline-dot-wrap { display: flex; flex-direction: column; align-items: center; }
  .ac-timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
  .ac-timeline-line { width: 1px; flex: 1; background: #353b4d; margin: 2px 0; }
  .ac-timeline-content { display: flex; flex-direction: column; padding-bottom: 10px; }
  .ac-timeline-label { font-size: 11px; font-weight: 700; }
  .ac-timeline-time  { font-size: 10.5px; color: #6b7280; margin-top: 1px; }
  .ac-timeline-detail{ font-size: 10.5px; color: #9aa0ad; margin-top: 2px; }

  /* ── Downloaded checkbox — sits inline beside the copy-ref button in
     .ac-icon-row ── */
  .ac-downloaded-wrap {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #9aa0ad; cursor: pointer;
  }
  .ac-downloaded-wrap input[type="checkbox"] { accent-color: #00d1b2; width: 13px; height: 13px; }

  /* ── On Hold reason modal ── */
  .dp-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .dp-modal {
    background: #1f222e; border: 1px solid #353b4d; border-radius: 10px;
    padding: 16px; width: min(320px, 86vw);
  }
  .dp-modal-title { font-size: 0.9rem; margin-bottom: 10px; }
  .dp-modal-textarea {
    width: 100%; min-height: 80px; background: #262a38; border: 1px solid #353b4d;
    color: #e3e6ee; border-radius: 8px; padding: 8px; font-size: 12px;
    font-family: inherit; resize: vertical;
  }
  .dp-modal-btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .dp-modal-cancel, .dp-modal-save {
    border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .dp-modal-cancel { background: transparent; border: 1px solid #353b4d; color: #9aa0ad; }
  .dp-modal-save   { background: #00d1b2; border: none; color: #111; }

  /* ── Toast ── */
  #dpToast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
    background: #262a38; border: 1px solid #353b4d; color: #e3e6ee;
    padding: 8px 14px; border-radius: 8px; font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 1100; max-width: 90vw; text-align: center;
  }
  #dpToast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty-state { color: #6b7280; font-size: 0.85rem; text-align: center; padding: 24px 0; grid-column: 1 / -1; }
  .loading     { color: #6b7280; font-size: 0.82rem; padding: 6px 0; grid-column: 1 / -1; }
  .total-badge { font-size: 0.78rem; color: #9aa0ad; }
  .total-badge span { color: #00d1b2; font-weight: 700; }

  .divider { border: none; border-top: 1px solid #2b2f3d; margin: 14px 0; }

  /* ── Today's Activity stats row ── */
  .dp-stats-row {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .dp-stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9aa0ad; }
  .dp-stat b { color: #e3e6ee; font-size: 13px; font-weight: 700; }
  .dp-stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dp-stat-total { margin-left: auto; color: #c7cbd8; }
  .dp-stat-total b { color: #00d1b2; }

  /* ── Auto-Refresh CRM: toggle switch + interval slider ── */
  .dp-toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .dp-switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
  .dp-switch input { opacity: 0; width: 0; height: 0; }
  .dp-switch-slider {
    position: absolute; inset: 0; cursor: pointer;
    background: #353b4d; border-radius: 20px; transition: background 0.15s ease;
  }
  .dp-switch-slider::before {
    content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px;
    background: #e3e6ee; border-radius: 50%; transition: transform 0.15s ease;
  }
  .dp-switch input:checked + .dp-switch-slider { background: #00d1b2; }
  .dp-switch input:checked + .dp-switch-slider::before { transform: translateX(15px); background: #0d1017; }
  .dp-toggle-label { font-size: 12.5px; color: #c7cbd8; }

  /* Hidden by default — JS reveals this the moment the toggle is on, and
     hides it again the instant it's switched off. */
  .dp-interval-wrap { display: none; margin: 10px 0 12px; }
  .dp-interval-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #9aa0ad; }
  .dp-interval-row input[type="range"] {
    flex: 1; accent-color: #00d1b2; height: 4px; cursor: pointer;
  }
  #dpAutoAllIntervalValue { min-width: 50px; text-align: right; color: #e3e6ee; font-weight: 700; font-size: 12px; }

  .quick-link-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; max-width: 320px; padding: 9px 12px;
    background: #262a38; border: 1px solid #353b4d; border-radius: 7px; color: #9aa0ad;
    font-size: 13px; font-weight: 500; text-decoration: none; margin-bottom: 6px;
  }
  .quick-link-btn:hover { border-color: #00d1b2; color: #00d1b2; }

  /* ── Footer: connection status + force sync + version ── */
  #dpFooter {
    flex-shrink: 0;
    margin-top: 16px; padding-top: 12px; border-top: 1px solid #2b2f3d;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #dpConnWrap { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #9aa0ad; }
  #dpConnDot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  #dpConnDot.dot-ok    { background: #00d1b2; }
  #dpConnDot.dot-warn  { background: #e6941a; }
  #dpConnDot.dot-error { background: #ef4444; }
  #dpForceSyncBtn {
    background: #262a38; border: 1px solid #353b4d; color: #9aa0ad;
    border-radius: 6px; padding: 4px 9px; font-size: 0.7rem; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  #dpForceSyncBtn:hover:not(:disabled) { border-color: #00d1b2; color: #00d1b2; }
  #dpForceSyncBtn:disabled { opacity: 0.6; cursor: default; }
  #dpVersionText { font-size: 0.72rem; color: #6b7280; font-family: monospace; }
</style>
</head>
<body>

  <div class="content">

    <!-- ── Shared identity picker ── -->
    <div id="setup">
      <label for="nameSelect">Select your name:</label>
      <select id="nameSelect">
        <option value="">-- Choose your name --</option>
        <option>Harvy</option>
        <option>Jabir</option>
        <option>Mark</option>
        <option>Sudheep</option>
      </select>
      <button class="save" id="saveBtn">Save</button>
    </div>

    <div id="identityBar">
      <div class="who-wrap">
        <span class="who" id="whoText"></span>
      </div>
      <button id="changeNameBtn">Change name</button>
    </div>

    <!-- ── Assignments ── -->
    <div id="assignSection">
      <div class="section-row">
        <div class="section-title">Active assignments</div>
        <div class="total-badge" id="totalBadge"></div>
      </div>

      <div id="dpCategoryTabs" class="dp-tabs"></div>

      <div id="listContainer"><div class="loading">Loading…</div></div>

      <hr class="divider">

      <div class="section-title">Today's Activity</div>
      <div id="dpTodayStats" class="dp-stats-row">
        <div class="dp-stat">
          <span class="dp-stat-dot" style="background:#4ade80"></span>
          Completed <b id="dpStatCompleted">0</b>
        </div>
        <div class="dp-stat">
          <span class="dp-stat-dot" style="background:#ef9a9a"></span>
          Rejected <b id="dpStatRejected">0</b>
        </div>
        <div class="dp-stat dp-stat-total">
          Total <b id="dpStatTotal">0</b>
        </div>
      </div>

      <hr class="divider">

      <div class="section-title">Auto-Refresh CRM</div>
      <div class="dp-toggle-row">
        <label class="dp-switch">
          <input type="checkbox" id="dpAutoAllToggle">
          <span class="dp-switch-slider"></span>
        </label>
        <span class="dp-toggle-label">Auto-click "All" on open CRM tabs</span>
      </div>
      <div id="dpAutoAllIntervalWrap" class="dp-interval-wrap">
        <div class="dp-interval-row">
          <span>Every</span>
          <input type="range" id="dpAutoAllInterval" min="1" max="60" step="1" value="5">
          <span id="dpAutoAllIntervalValue">5 min</span>
        </div>
      </div>

      <hr class="divider">

      <div class="section-title">Quick Links</div>
      <a href="https://dp-dashboard-5j9.pages.dev/" target="_blank" class="quick-link-btn">🖥 Open Dashboard</a>
      <a href="https://docs.google.com/spreadsheets/d/19UgIXRizvOcly1UBKJuQIcKe0s4KuSEPuPUOqc5zN-8/edit?gid=460408169#gid=460408169" target="_blank" class="quick-link-btn">📊 Open Google Sheet</a>
    </div>

    <div id="dpFooter">
      <div id="dpConnWrap">
        <div id="dpConnDot" class="dot-warn"></div>
        <span id="dpConnText">Checking…</span>
      </div>
      <button id="dpForceSyncBtn" title="Re-check connection and re-fetch the latest data from the Sheet, bypassing any local cache">⟳ Force Sync</button>
      <span id="dpVersionText"></span>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
